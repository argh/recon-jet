# microWakeWord training configuration (the notebook's defaults). Paths are relative to $WORK.
window_step_ms: 10
train_dir: trained_models/wakeword
features:
  - features_dir: generated_augmented_features
    sampling_weight: 2.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: generated_negatives_features   # piper saying things that sound like the phrase
    sampling_weight: 3.0
    penalty_weight: 2.0
    truth: false
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: negative_datasets/speech
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: negative_datasets/dinner_party
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: negative_datasets/no_speech
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: negative_datasets/dinner_party_eval   # validation and testing only
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: split
    type: mmap
training_steps: [20000]
positive_class_weight: [1]
negative_class_weight: [20]
learning_rates: [0.001]
batch_size: 128
time_mask_max_size: [0]
time_mask_count: [0]
freq_mask_max_size: [0]
freq_mask_count: [0]
eval_step_interval: 500
clip_duration_ms: 1500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall
# Optional: the owner's own recordings as positives (clips in $WORK/generated_rg, `features.py WORK rg`),
# added to a copy of this file run with PARAMS=copy.yaml train.sh. Round 6 of heya_jet used them:
