<!doctype html>
<!-- jet live: served by `jet live` (host/modules/live.js), which bridges jetd's protocol over a
     WebSocket: JSON text events, binary payloads (mirror rects, speaker tee, mic chunks). This
     page renders the glass, plays its audio, and injects input back (H k / H r / V). -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jet live</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 14px; background: #101216; color: #cfd6e4;
         font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #glass { image-rendering: pixelated; background: #000; border: 1px solid #2a2f3a;
           border-radius: 4px; touch-action: none; cursor: crosshair; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: inherit; background: #1b2029; border: 1px solid #343b49;
           border-radius: 5px; padding: 6px 16px; cursor: pointer; }
  button:active, button.held { background: #2f5a3a; border-color: #4a8a5a; }
  button.ptt:active { background: #5a2f2f; border-color: #8a4a4a; }
  label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #status { color: #8a93a6; min-height: 1.2em; }
  #events { width: 640px; max-width: 92vw; height: 7em; overflow: hidden; color: #5f6878;
            white-space: pre; font-size: 11px; }
  .hint { color: #5f6878; font-size: 11px; }
</style>
<canvas id="glass" width="428" height="240"></canvas>
<div class="row">
  <button id="front">FRONT</button>
  <button id="rear">REAR</button>
  <button id="ptt" class="ptt">HOLD TO TALK</button>
  <label><input type="checkbox" id="sound"> sound</label> <span id="audiostat" class="hint"></span>
  <label><input type="checkbox" id="micmon"> monitor mic</label>
  <label><input type="checkbox" id="kbd"> keyboard</label>
</div>
<div id="status">connecting…</div>
<div class="hint" id="hint">drag on the glass = pad swipe · click = front tap · Enter/Backspace = front/rear (hold works) · arrows = swipes</div>
<div id="events"></div>
<script>
const canvas = document.getElementById('glass'), ctx = canvas.getContext('2d');
const status = document.getElementById('status'), events = document.getElementById('events');
let fmt = { w: 428, h: 240, bpp: 16 };
let pending = null;               // header waiting for its binary message
const scale = Math.max(1, Math.min(3, Math.floor(innerWidth / 460)));
canvas.style.width = `${428 * Math.max(2, scale)}px`;

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.binaryType = 'arraybuffer';
const send = (line) => { if (ws.readyState === 1) ws.send(line); };

const evlog = (() => { const lines = []; return (s) => {
  lines.push(s); if (lines.length > 6) lines.shift(); events.textContent = lines.join('\n');
}; })();

ws.onopen = () => { status.textContent = 'bridge up, waiting for the glass…'; };
ws.onclose = () => { status.textContent = 'bridge closed — restart `jet live` and reload'; };
ws.onmessage = (e) => {
  if (typeof e.data === 'string') {
    const m = JSON.parse(e.data);
    if (m.t === 'fmt') { fmt = m; canvas.width = m.w; canvas.height = m.h; status.textContent = `mirroring ${m.w}x${m.h} @ ${m.bpp} bpp`; }
    else if (m.t === 'b' || m.t === 'u' || m.t === 'a') pending = m;
    else if (m.t === 'line') { const l = m.line; if (l[0] === 'm') status.textContent = `mode: ${l.slice(2)}`; if ('kmrxwdgon'.includes(l[0])) evlog(l); }
    else if (m.t === 'gone') status.textContent = 'link to the glass lost — reconnecting… (the device itself is fine)';
    return;
  }
  const p = pending; pending = null;
  if (!p) return;
  if (p.t === 'b') blit(p, new DataView(e.data));
  else if (p.t === 'u') play(e.data, 48000, 2);
  else if (p.t === 'a' && micmon.checked) play(e.data, 16000, 1);
};

function blit(r, dv) {
  const img = ctx.createImageData(r.w, r.h), px = img.data, bytes = fmt.bpp / 8;
  for (let i = 0, n = r.w * r.h; i < n; i++) {
    let R, G, B;
    if (bytes === 2) { const v = dv.getUint16(i * 2, true); R = (v >> 8) & 0xf8; G = (v >> 3) & 0xfc; B = (v << 3) & 0xf8; }
    else { const v = dv.getUint32(i * 4, true); R = (v >> 16) & 255; G = (v >> 8) & 255; B = v & 255; }
    px[i * 4] = R; px[i * 4 + 1] = G; px[i * 4 + 2] = B; px[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, r.x, r.y);
}

/* ---- audio: one AudioWorklet ring as the single continuous source. Scheduling hundreds of
   5 ms BufferSources put a sample-rounding click at every chunk boundary — at the tee's ~187
   chunks/s that is a loud 187 Hz growl over the signal. The context is pinned to 48 kHz so
   speaker frames map 1:1; mic chunks (16 kHz mono) are linearly upsampled into the same ring. */
const sound = document.getElementById('sound'), micmon = document.getElementById('micmon');
const audiostat = document.getElementById('audiostat');
let actx = null, sink = null, heard = 0, played = 0, written = 0, aerr = '', lastUnder = 0, clipT0 = 0, clipBytes = 0, clipLast = 0;
const astat = () => { audiostat.textContent = `rx ${(heard / 1024) | 0}k played ${(played / 1024) | 0}k out ${(written / 48000) | 0}s ctx ${actx ? actx.state : '-'}${aerr ? ' ERR ' + aerr : ''}`; };
const SINK = `class JetSink extends AudioWorkletProcessor {
  constructor() { super(); this.q = []; this.off = 0; this.buffered = 0; this.started = false;
    this.port.onmessage = (e) => { this.q.push(e.data); this.buffered += e.data[0].length; }; }
  process(inputs, outputs) {
    const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length;
    if (!this.started) { if (this.buffered < 4800) return true; this.started = true; }
    let i = 0;
    while (i < n && this.q.length) {
      const [l, r] = this.q[0], take = Math.min(n - i, l.length - this.off);
      L.set(l.subarray(this.off, this.off + take), i);
      R.set(r.subarray(this.off, this.off + take), i);
      i += take; this.off += take; this.buffered -= take;
      if (this.off === l.length) { this.q.shift(); this.off = 0; }
    }
    this.wrote = (this.wrote || 0) + i;
    this.minbuf = Math.min(this.minbuf ?? 1e9, this.buffered);
    if (i < n && this.started) this.under = (this.under || 0) + 1;
    // chunks arrive every ~5 ms but process() runs every ~2.7 ms, so a transiently empty queue
    // is NORMAL mid-stream: only a sustained gap (~60 ms) re-arms the prebuffer for the next clip
    if (i < n) { if (++this.empty > 24) { this.started = false; this.empty = 0; } }
    else this.empty = 0;
    if ((this.tick = (this.tick || 0) + 1) % 47 === 0) {   // ~8 Hz telemetry
      this.port.postMessage({ wrote: this.wrote, under: this.under || 0, minbuf: this.minbuf === 1e9 ? -1 : this.minbuf });
      this.minbuf = 1e9;
    }
    return true;
  }
}
registerProcessor('jet-sink', JetSink);`;
sound.onchange = async () => {
  try {
    if (sound.checked && !actx) {
      actx = new AudioContext({ sampleRate: 48000 });
      await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([SINK], { type: 'text/javascript' })));
      sink = new AudioWorkletNode(actx, 'jet-sink', { outputChannelCount: [2] });
      sink.onprocessorerror = () => { aerr = 'processor died'; astat(); };
      sink.port.onmessage = (e) => { written = e.data.wrote; astat(); if (e.data.under !== lastUnder || e.data.minbuf >= 0) { if (e.data.minbuf >= 0 || e.data.under !== lastUnder) evlog(`audio under=${e.data.under} minbuf=${e.data.minbuf}`); lastUnder = e.data.under; } };
      sink.connect(actx.destination);
    }
    await actx?.resume();
  } catch (e) { aerr = e.message; }
  astat();
};
function play(ab, rate, channels) {
  heard += ab.byteLength;
  const now = performance.now();
  if (now - clipT0 > 300) { if (clipBytes) evlog(`clip rx ${clipBytes}B over ${(clipLast - clipT0) | 0}ms`); clipT0 = now; clipBytes = 0; }
  clipBytes += ab.byteLength; clipLast = now;
  try {
    if (!sound.checked || !sink) return;
    const whole = ab.byteLength & ~(2 * channels - 1);        // never trip on a sub-frame tail
    const s16 = new Int16Array(ab, 0, whole / 2), frames = s16.length / channels;
    if (!frames) return;
    let L, R;
    if (rate === 48000) {
      L = new Float32Array(frames); R = new Float32Array(frames);
      for (let i = 0; i < frames; i++) { L[i] = s16[i * channels] / 32768; R[i] = s16[i * channels + (channels - 1)] / 32768; }
    } else {                                                   // 16 kHz mono mic: upsample x3, linear
      const up = frames * 3; L = new Float32Array(up);
      for (let i = 0; i < frames; i++) {
        const a = s16[i] / 32768, b = s16[Math.min(i + 1, frames - 1)] / 32768;
        L[i * 3] = a; L[i * 3 + 1] = a + (b - a) / 3; L[i * 3 + 2] = a + 2 * (b - a) / 3;
      }
      R = L.slice();
    }
    sink.port.postMessage([L, R], [L.buffer, R.buffer]);
    played += ab.byteLength;
  } catch (e) { aerr = e.message; } finally { astat(); }
}

/* ---- input: surrogate pod controls; real press/release so holds work. One exception: a long
   REAR hold is the hardware power path (PMIC), so injected rear presses auto-release well before
   that — a remote page must not be able to power the device off. ---------------------------- */
const FRONT = 86, REAR = 107;    // BTN_FRONT_CODE / BTN_REAR_CODE (agent/jetd.c)
const REAR_CAP_MS = 800;
let rearTimer = null;
function press(code) { send(`H k ${code} 1`); if (code === REAR) rearTimer = setTimeout(() => release(code, true), REAR_CAP_MS); }
function release(code, capped) {
  if (code === REAR) { if (!rearTimer) return; clearTimeout(rearTimer); rearTimer = null;
    if (capped) status.textContent = 'rear auto-released (long rear hold is the hardware power switch)'; }
  send(`H k ${code} 0`);
}
function bindButton(el, code) {
  el.addEventListener('pointerdown', () => { el.classList.add('held'); press(code); });
  const up = () => { if (!el.classList.contains('held')) return; el.classList.remove('held'); release(code); };
  el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up);
}
bindButton(document.getElementById('front'), FRONT);
bindButton(document.getElementById('rear'), REAR);

const ptt = document.getElementById('ptt');
ptt.addEventListener('pointerdown', () => { ptt.classList.add('held'); send('V 15'); });
ptt.addEventListener('pointerup', () => { ptt.classList.remove('held'); send('v'); });

let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const k = canvas.width / canvas.getBoundingClientRect().width;      // CSS px -> panel px
  const dx = Math.round((e.clientX - drag.x) * k), dy = Math.round((e.clientY - drag.y) * k);
  drag = null;
  if (Math.abs(dx) < 4 && Math.abs(dy) < 4) { send(`H k ${FRONT} 1`); send(`H k ${FRONT} 0`); }  // tap
  else send(`H r ${dx} ${dy}`);                                        // one summed gesture, like the pad driver
});

/* ---- keyboard: two interpretations of the same keys, picked by the toggle.
   OFF (default): a few local shortcuts stand in for the pod controls.
   ON: every key is sent as a real keyboard event (`H t`, the BT-keyboard path on the device:
   type into the shell, Ctrl+Alt+Enter toggles it, modifiers included). ------------------- */
const kbd = document.getElementById('kbd'), hint = document.getElementById('hint');
const HINTS = {
  off: 'drag on the glass = pad swipe · click = front tap · Enter/Backspace = front/rear (hold works) · arrows = swipes',
  on: 'keyboard passes through to the device (shell typing, Ctrl+Alt+Enter, arrows as menu keys) — untick to get the front/rear shortcuts back',
};
kbd.onchange = () => {
  hint.textContent = HINTS[kbd.checked ? 'on' : 'off'];
  kbd.blur();                     // or Space while typing toggles the checkbox again
  release(FRONT); release(REAR);  // a shortcut held across the switch must not stick (ups are safe no-ops)
};

// KeyboardEvent.code -> Linux evdev KEY_* (input-event-codes.h); enough for a US BT keyboard
const EV = { Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9, Digit9: 10, Digit0: 11,
  Minus: 12, Equal: 13, Backspace: 14, Tab: 15, KeyQ: 16, KeyW: 17, KeyE: 18, KeyR: 19, KeyT: 20, KeyY: 21, KeyU: 22, KeyI: 23, KeyO: 24, KeyP: 25,
  BracketLeft: 26, BracketRight: 27, Enter: 28, ControlLeft: 29, KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33, KeyG: 34, KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38,
  Semicolon: 39, Quote: 40, Backquote: 41, ShiftLeft: 42, Backslash: 43, KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48, KeyN: 49, KeyM: 50,
  Comma: 51, Period: 52, Slash: 53, ShiftRight: 54, AltLeft: 56, Space: 57, ControlRight: 97, AltRight: 100,
  Home: 102, ArrowUp: 103, PageUp: 104, ArrowLeft: 105, ArrowRight: 106, End: 107, ArrowDown: 108, PageDown: 109, Insert: 110, Delete: 111,
  F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66, F9: 67, F10: 68, F11: 87, F12: 88 };

const KEYS = { Enter: FRONT, Backspace: REAR };
const held = new Set();                                    // H t keys currently down on the device
addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey) return;                       // Cmd combos stay the browser's
  if (kbd.checked) {
    const code = EV[e.code];
    if (code !== undefined) { e.preventDefault(); held.add(code); send(`H t ${code} 1`); }
    return;
  }
  if (KEYS[e.key] !== undefined) { e.preventDefault(); press(KEYS[e.key]); }
  const sw = { ArrowUp: '0 -40', ArrowDown: '0 40', ArrowLeft: '-40 0', ArrowRight: '40 0' }[e.key];
  if (sw) { e.preventDefault(); send(`H r ${sw}`); }
});
addEventListener('keyup', (e) => {
  if (kbd.checked) { const code = EV[e.code]; if (code !== undefined) { held.delete(code); send(`H t ${code} 0`); } return; }
  if (KEYS[e.key] !== undefined) release(KEYS[e.key]);
});
// focus leaves (Cmd-Tab, window switch): release everything held, or a lost keyup latches a
// modifier on the device and every later Enter becomes the Ctrl+Alt+Enter shell hotkey
const flushHeld = () => { for (const code of held) send(`H t ${code} 0`); held.clear(); release(FRONT); release(REAR); };
addEventListener('blur', flushHeld);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushHeld(); });
</script>
</html>
